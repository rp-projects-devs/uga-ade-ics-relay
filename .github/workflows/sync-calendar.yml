name: Sync calendrier ADE

on:
  schedule:
    - cron: "17 */3 * * *"   # toutes les 3 h (UTC), minute décalée pour éviter les pics
  workflow_dispatch:           # bouton "Run workflow" pour un lancement manuel

permissions:
  contents: read
  actions: write               # uniquement pour le keepalive (réactivation du workflow)

concurrency:
  group: sync-calendar
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Vérifier la configuration
        env:
          VPN_CONFIG: ${{ secrets.VPN_CONFIG }}
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
          ICS_URL: ${{ secrets.ICS_URL }}
          GIST_ID: ${{ secrets.GIST_ID }}
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
        run: |
          missing=0
          for v in VPN_CONFIG VPN_USERNAME VPN_PASSWORD ICS_URL GIST_ID GIST_TOKEN; do
            if [ -z "${!v}" ]; then
              echo "❌ Secret manquant : $v"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Configure les secrets du dépôt (voir README)."
            exit 1
          fi
          echo "✅ Tous les secrets sont présents"

      - name: Installer OpenVPN
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            openvpn openvpn-systemd-resolved jq > /dev/null
          openvpn --version | head -n 1

      - name: Connexion au VPN
        env:
          VPN_CONFIG: ${{ secrets.VPN_CONFIG }}
          VPN_USERNAME: ${{ secrets.VPN_USERNAME }}
          VPN_PASSWORD: ${{ secrets.VPN_PASSWORD }}
        run: |
          umask 077
          workdir="$RUNNER_TEMP/vpn"
          mkdir -p "$workdir"

          # tr -d '\r' : neutralise les fins de ligne Windows d'un copier-coller
          printf '%s\n' "$VPN_CONFIG" | tr -d '\r' > "$workdir/vpn.ovpn"
          printf '%s\n%s\n' "$VPN_USERNAME" "$VPN_PASSWORD" | tr -d '\r' > "$workdir/auth.txt"

          # Chemins absolus : --daemon change le répertoire courant vers /
          sudo openvpn \
            --config "$workdir/vpn.ovpn" \
            --auth-user-pass "$workdir/auth.txt" \
            --auth-nocache \
            --allow-compression asym \
            --script-security 2 \
            --up /etc/openvpn/update-systemd-resolved \
            --down /etc/openvpn/update-systemd-resolved \
            --down-pre \
            --log "$workdir/vpn.log" \
            --daemon

          ok=0
          for _ in $(seq 1 60); do
            if sudo grep -q "Initialization Sequence Completed" "$workdir/vpn.log" 2>/dev/null; then
              ok=1
              break
            fi
            if sudo grep -qE "AUTH_FAILED|Exiting due to fatal error" "$workdir/vpn.log" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          rm -f "$workdir/auth.txt" "$workdir/vpn.ovpn"

          if [ "$ok" -eq 1 ]; then
            echo "✅ VPN connecté"
            exit 0
          fi

          # Dépôt public : diagnostic filtré uniquement, adresses IP masquées
          echo "❌ Échec de connexion VPN. Diagnostic :"
          pattern='AUTH_FAILED|TLS Error|TLS handshake failed|fatal error|Connection timed out|Options error'
          diag=$(sudo grep -oE "($pattern).*" "$workdir/vpn.log" 2>/dev/null \
            | sed -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g' | tail -n 5 || true)
          echo "${diag:-(aucune erreur identifiée : délai de connexion dépassé)}"
          exit 1

      - name: Télécharger le calendrier
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
        run: |
          url=$(printf '%s' "$ICS_URL" | tr -d '\r\n' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')

          set +e
          http_code=$(curl -sS -L --retry 3 --retry-delay 5 --connect-timeout 20 --max-time 90 \
            -o "$RUNNER_TEMP/cours.ics" -w '%{http_code}' "$url" 2>/dev/null)
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            case "$rc" in
              6)  reason="nom d'hôte introuvable (DNS)" ;;
              7)  reason="connexion refusée" ;;
              28) reason="délai dépassé" ;;
              35|60) reason="erreur TLS/certificat" ;;
              *)  reason="erreur curl $rc" ;;
            esac
            echo "❌ Téléchargement impossible : $reason. Gist non modifié."
            exit 1
          fi
          if [ "$http_code" != "200" ]; then
            echo "❌ Le serveur a répondu HTTP $http_code. Gist non modifié."
            exit 1
          fi
          if ! grep -q "BEGIN:VCALENDAR" "$RUNNER_TEMP/cours.ics" \
             || ! grep -q "END:VCALENDAR" "$RUNNER_TEMP/cours.ics"; then
            echo "❌ Le fichier reçu n'est pas un calendrier ICS complet. Gist non modifié."
            exit 1
          fi

          events=$(grep -c "BEGIN:VEVENT" "$RUNNER_TEMP/cours.ics" || true)
          if [ "$events" -eq 0 ]; then
            echo "⚠️ Calendrier valide mais vide (vacances ?)"
          else
            echo "✅ Calendrier récupéré ($events événement(s))"
          fi

      - name: Publier sur le Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: ${{ secrets.GIST_ID }}
        run: |
          gid=$(printf '%s' "$GIST_ID" | tr -d '[:space:]')
          jq -Rs '{files: {"cours.ics": {content: .}}}' "$RUNNER_TEMP/cours.ics" > "$RUNNER_TEMP/payload.json"

          status=$(curl -s -o /dev/null -w '%{http_code}' \
            --retry 3 --retry-delay 5 --max-time 60 \
            -X PATCH \
            -H "Authorization: Bearer $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            --data-binary @"$RUNNER_TEMP/payload.json" \
            "https://api.github.com/gists/$gid")
          rm -f "$RUNNER_TEMP/payload.json" "$RUNNER_TEMP/cours.ics"

          case "$status" in
            200) echo "✅ Gist mis à jour" ;;
            401) echo "❌ GIST_TOKEN invalide ou expiré (HTTP 401)"; exit 1 ;;
            403) echo "❌ GIST_TOKEN sans le droit « gist » (HTTP 403)"; exit 1 ;;
            404) echo "❌ GIST_ID introuvable, ou Gist appartenant à un autre compte (HTTP 404)"; exit 1 ;;
            *)   echo "❌ Mise à jour du Gist échouée (HTTP $status)"; exit 1 ;;
          esac

      - name: Déconnexion VPN
        if: always()
        run: sudo killall openvpn 2>/dev/null || true

      - name: Keepalive (évite la désactivation après 60 jours)
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          if gh api --method PUT "repos/$REPO/actions/workflows/sync-calendar.yml/enable" > /dev/null 2>&1; then
            echo "✅ Workflow maintenu actif"
          else
            echo "ℹ️ Keepalive ignoré"
          fi
